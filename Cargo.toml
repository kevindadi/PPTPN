[package]
name = "ptpn"
version = "0.1.0"
edition = "2021"
description = "优先级时间 Petri 网 (Priority-Time Petri Net) 分析与状态类生成"
license = "MIT"
authors = ["PTPN Contributors"]
repository = ""

[dependencies]
petgraph = "0.6"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "tdg_parsing"
harness = false

[[bench]]
name = "state_class_build"
harness = false

[[bench]]
name = "full_pipeline"
harness = false
