[package]
name = "ptpn"
version = "0.1.0"
edition = "2024"
description = "Priority Timed Petri Net analyzer (Rust port of the C++ PTPN)"

[lib]
name = "ptpn"
path = "src/lib.rs"

[[bin]]
name = "ptpn"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
unipn = { path = "../../.." }

[profile.release]
lto = true
